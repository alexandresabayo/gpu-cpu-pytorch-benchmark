training:
  batch_size: 256
  epochs: 200
  learning_rate: 0.001
  train_ratio: 0.7
  val_ratio: 0.2
  test_ratio: 0.1
  dropout: 0.2
  early_stopping: true
  patience: 20
  training_history: true

models:
  temperature:
    seq_length: 84
    pred_length: 12
    features: 1
  
  mnist:
    channels: 1
    height: 28
    width: 28
    num_classes: 10

datasets:
  # Path to dataset directory
  dataset_dir: "datasets"
  
  # Enable automatic download from raw sources if files don't exist
  auto_download: true